<!--/* SPA clientlibs */-->
<sly data-sly-use.clientlib="core/wcm/components/commons/v1/templates/clientlib.html">
    <sly data-sly-call="${clientlib.css @ categories=['airline.base', 'airline.react']}"/>
</sly>

<!--/* SPA page model URL — single source of truth */-->
<sly data-sly-use.page="com.adobe.aem.spa.project.core.models.Page"/>
<sly data-sly-test.pageModelUrl="${page.hierarchyRootJsonExportUrl || '{0}.model.json' @ format=[currentPage.path]}"/>
<meta property="cq:pagemodel_root_url" content="${pageModelUrl}"/>

<meta name="theme-color" content="#000000"/>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
<base href="/"/>

<!--/* Editor mode meta tags */-->
<meta property="cq:datatype"  data-sly-test="${wcmmode.edit || wcmmode.preview}" content="JSON"/>
<meta property="cq:wcmmode"   data-sly-test="${wcmmode.edit}"                    content="edit"/>
<meta property="cq:wcmmode"   data-sly-test="${wcmmode.preview}"                 content="preview"/>
<meta property="cq:wcmmode"   data-sly-test="${wcmmode.disabled}"                content="disabled"/>
